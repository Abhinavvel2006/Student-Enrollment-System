<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<style>
    :root {
        --blue: #172b68;
        --blue-light: #eaf0ff;
        --black: #121212;
        --muted: #667085;
        --line: #e2e5ea;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #ffffff;
        color: var(--black);
        font-family: "Segoe UI", Tahoma, sans-serif;
    }

    .student-profile .row {
        min-height: 100vh;
        margin: 0;
    }

    .sidepanel-container {
        display: none;
    }

    .content-container {
        min-height: 100vh;
        margin-left: 0;
        padding: 0 42px 48px;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 86px;
        border-bottom: 1px solid var(--line);
    }

    .topbar-left {
        display: flex;
        align-items: center;
        flex: 1;
    }

    .back-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        margin-right: 16px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--blue);
        font-size: 18px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-decoration: none;
    }

    .back-button:hover {
        background: var(--blue-light);
        border-color: var(--blue);
    }

    .navbar-brand {
        display: flex;
        align-items: center;
        height: auto;
        padding: 0;
        color: var(--black) !important;
        font-size: 16px;
    }

    .brand-logo {
        width: 52px;
        height: 52px;
        margin-right: 12px;
        object-fit: contain;
    }

    .navbar-brand small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 400;
    }

    main {
        padding-top: 42px;
    }

    .page-heading {
        margin-bottom: 28px;
    }

    .page-heading h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
    }

    .page-heading p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
    }

    .profile-table {
        width: 100%;
        max-width: 760px;
        overflow-x: auto;
        border: 1px solid var(--line);
        margin: 0 auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
    }

    th,
    td {
        padding: 16px 14px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
        white-space: nowrap;
    }

    th {
        width: 220px;
        background: var(--blue-light);
        color: var(--blue);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
    }

    tbody tr:last-child td {
        border-bottom: 0;
    }

    tbody tr:hover {
        background: #fafbff;
    }

    .profile-table input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 13px;
        font-family: inherit;
        transition: border-color 0.2s ease;
    }

    .profile-table input:focus {
        outline: none;
        border-color: var(--blue);
        background: var(--blue-light);
    }

    .button-group {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        justify-content: center;
    }

    .btn-primary,
    .btn-secondary {
        padding: 10px 24px;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .btn-primary {
        background: var(--blue);
        color: #ffffff;
    }

    .btn-primary:hover {
        background: #0f1f47;
    }

    .btn-secondary {
        background: var(--blue-light);
        color: var(--blue);
        border: 1px solid var(--blue);
    }

    .btn-secondary:hover {
        background: #ffffff;
    }

    @media (max-width: 991px) {
        .topbar-left {
            flex-wrap: wrap;
        }

        .content-container {
            padding: 0 24px 36px;
        }
    }

    @media (max-width: 600px) {
        .back-button {
            width: 36px;
            height: 36px;
            font-size: 16px;
            margin-right: 12px;
        }

        .navbar-brand {
            flex-direction: column;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            margin-right: 8px;
        }

        .content-container {
            padding: 0 16px 28px;
        }

        .topbar {
            min-height: 76px;
        }

        main {
            padding-top: 30px;
        }

        .page-heading h1 {
            font-size: 24px;
        }

        .button-group {
            flex-direction: column;
        }

        .btn-primary,
        .btn-secondary {
            width: 100%;
        }
    }
</style>

<body>
    <div class="student-profile">
        <div class="row">
            <div class="content-container col-md-12">
                <nav class="topbar">
                    <div class="topbar-left">
                        <a class="back-button" href="#back" title="Go Back">
                            <i class="fa-solid fa-arrow-left"></i>
                        </a>
                        <div class="navbar-brand">
                            <img class="brand-logo" src="image.png" alt="Scott Christian College logo">
                            <span>
                                <strong>Scott Christian College(Autonomous)</strong>
                                <small>Student Enrollment System</small>
                            </span>
                        </div>
                    </div>
                </nav>
                <main>
                    <div class="page-heading" id="profile">
                        <h1>Edit Student Record</h1>
                        <p>Update student enrollment information and academic details.</p>
                    </div>
                    <div class="profile-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Field</th>
                                    <th>Details</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <th scope="row">Student ID</th>
                                    <td><input type="text" value="SC2025001" placeholder="Student ID" disabled></td>
                                </tr>
                                <tr>
                                    <th scope="row">Application ID</th>
                                    <td><input type="text" value="APP2025001" placeholder="Application ID" disabled></td>
                                </tr>
                                <tr>
                                    <th scope="row">Student Name</th>
                                    <td><input type="text" value="Student Name" placeholder="Student Name"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Class NO</th>
                                    <td><input type="text" value="01" placeholder="Class Number"></td>
                                </tr>
                                <tr>
                                    <th scope="row">DOB</th>
                                    <td><input type="date" value="2005-01-15" placeholder="Date of Birth"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Gender</th>
                                    <td>
                                        <select style="width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13px;">
                                            <option value="Female" selected>Female</option>
                                            <option value="Male">Male</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </td>
                                </tr>
                                <tr>
                                    <th scope="row">Dept ID</th>
                                    <td><input type="text" placeholder="Department ID"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Dept name</th>
                                    <td><input type="text" placeholder="Department Name"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Email</th>
                                    <td><input type="email" placeholder="Email Address"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Phone</th>
                                    <td><input type="tel" placeholder="Phone Number"></td>
                                </tr>
                                <tr>
                                    <th scope="row">Address</th>
                                    <td><input type="text" placeholder="Address"></td>
                                </tr>
                            </tbody>
                        </table>
                        <div class="button-group">
                            <button class="btn-primary">Save Changes</button>
                            <button class="btn-secondary">Cancel</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
</body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.4/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

</html>
